plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.juananzzz.resonus'
version = '0.0.1'

android {
  namespace 'androidx.media3.decoder.ffmpeg'

  defaultConfig {
    versionCode 1
    versionName '0.0.1'
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  // Keep this exactly aligned with expo-audio 56.0.13. The renderer extension
  // is loaded reflectively by Media3, so the player remains unchanged for all
  // formats except ALAC, the only decoder compiled into libffmpegJNI.so.
  api 'androidx.media3:media3-decoder:1.9.0'
  implementation 'androidx.media3:media3-exoplayer:1.9.0'
  implementation 'androidx.annotation:annotation:1.9.1'
  compileOnly 'org.checkerframework:checker-qual:3.48.4'
}
