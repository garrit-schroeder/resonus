// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.carauto'
version = '0.0.1'

android {
  namespace "expo.modules.carauto"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  buildFeatures {
    buildConfig true
  }
  testOptions {
    unitTests.includeAndroidResources = true
  }
}

dependencies {
  // Media3 has to be the same version expo-audio pulls in: the car session and
  // the playback one live in the same process, and two copies of these classes
  // is how they end up disagreeing at runtime.
  def androidxMedia3Version = "1.9.0"
  implementation "androidx.media3:media3-session:$androidxMedia3Version"
  implementation "androidx.media3:media3-common:$androidxMedia3Version"
  implementation "androidx.media3:media3-exoplayer:$androidxMedia3Version"

  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16.1'
}
