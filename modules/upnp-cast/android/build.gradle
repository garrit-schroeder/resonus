// See the note in modules/audio-eq/android/build.gradle: the plugin is what
// brings the compiler plugin the module DSL needs from SDK 56 on.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.upnpcast'
version = '0.0.1'

android {
  namespace "expo.modules.upnpcast"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
}

dependencies {
  // SSDP, SOAP and DIDL-Lite are implemented in this module so the session can
  // switch to a Sonos group coordinator and keep sending every later command
  // there as well.
  testImplementation 'junit:junit:4.13.2'
}
