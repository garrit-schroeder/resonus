name: AltStore source

# Adds a published release to Source.json. On publishing and not on the tag, so
# AltStore never offers an .ipa that is still in a draft.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of a published release, such as v0.8.5
        required: true

permissions:
  contents: write

concurrency:
  group: altstore-source

jobs:
  update:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Add the version
        run: |
          DATE=$(gh release view "$TAG" --json publishedAt --jq .publishedAt)
          SIZE=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.name | endswith(".ipa")) | .size')
          node scripts/altstore-add-version.mjs "${TAG#v}" "$DATE" "$SIZE"
      - name: Push it
        run: |
          git diff --quiet Source.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Source.json
          git commit -qm "chore(ios): ${TAG#v} in the AltStore source"
          git push origin main
